[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dfer"
version = "0.1.0"
description = "Dynamic facial expression recognition on DFEW with self-supervised video transformers"
authors = [{ name = "Youssef Khazal" }, { name = "Melissa Fahed" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
